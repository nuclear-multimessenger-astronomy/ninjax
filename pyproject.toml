[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/ninjax"]

[tool.hatch.build.targets.sdist]
exclude = ["examples/*/outdir/", "examples/**/outdir/", "dist/"]

[project]
name = "ninjax"
authors = [{ name = "Peter T. H. Pang", email = "tsunhopang@gmail.com" }]
version = "0.0.1"
description = "Joint multi-messenger parameter estimation in JAX"
keywords = [
  "gravitational-waves",
  "kilonova",
  "multi-messenger",
  "equation-of-state",
  "bayesian-inference",
  "jax",
]
readme = "README.md"
requires-python = ">=3.11, <3.14"
license = { file = "LICENSE" }
urls = { repository = "https://github.com/nuclear-multimessenger-astronomy/ninjax" }
dependencies = [
  "jimgw>=0.5.0",    # GW: likelihoods, priors, transforms, sampler drivers
  "fiestaEM>=0.2.1", # EM: kilonova and afterglow surrogate light curves
  "jesterTOV",       # EOS: metamodel/CSE equations of state and TOV solver
  "astropy",         # cosmology and time conversions in signal generation
  "pandas",          # parameter tables in signal generation
  "tyro",            # command-line parsing for the generation entry point
]

classifiers = [
  "Programming Language :: Python :: 3",
  'Programming Language :: Python :: 3.11',
  'Programming Language :: Python :: 3.12',
  'Programming Language :: Python :: 3.13',
  'License :: OSI Approved :: MIT License',
  'Intended Audience :: Science/Research',
  'Intended Audience :: Developers',
  'Natural Language :: English',
  'Topic :: Scientific/Engineering',
  'Operating System :: POSIX',
  'Operating System :: Unix',
  'Operating System :: MacOS',
]

[project.scripts]
ninjax-generate = "ninjax.cli.generate:main"

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "pytest-cov>=4.0",
  "pytest-xdist>=3.0",
  "hypothesis>=6.0",
  "pytest-timeout>=2.1.0",
  "pre-commit>=4.5.0",
  "sphinx>=7.0",
  "sphinx-autobuild",
  "sphinx-book-theme>=1.0",
  "sphinx-design>=0.5",
  "nbsphinx>=0.9",
  "sphinx-autodoc-typehints>=1.12",
  "sphinx-copybutton>=0.5",
  "myst-parser>=2.0",
  "sphinxcontrib-mermaid>=1.0",
  "sphinxcontrib-bibtex>=2.0",
  "ipykernel>=7.1.0",
  "nbconvert>=7.0",
]

[dependency-groups]
dev = ["nbqa>=1.9.1", "ruff>=0.15.0"]

# jesterTOV on PyPI is still 0.1.1, which ships the older flat `eos.py`/`tov.py`
# layout. ninjax targets the restructured `eos/`, `tov/` packages, so track main.
[tool.uv.sources]
jesterTOV = { git = "https://github.com/nuclear-multimessenger-astronomy/jester.git", branch = "main" }

# jim owns the sampler, so its pins win wherever jester disagrees. jester's own
# bounds exist to support its `jesterTOV.inference` stack, which ninjax does not
# use -- we drive jester only as an EOS/TOV library. Overriding these breaks
# `jesterTOV.inference.samplers.flowmc` (and `run_inference`, which imports it);
# the EOS/TOV physics path and jester's likelihood base classes are unaffected.
[tool.uv]
override-dependencies = [
    "jax>=0.8.2",      # jim needs >=0.8.2; jester caps <0.8.0
    "jaxlib>=0.8.2",
    "blackjax>=1.6",   # jim needs PyPI >=1.6; jester requests a git fork
    "flowmc>=0.6.1",   # jim needs >=0.6.1; jester pins ==0.4.5
    "optax>=0.2.7",    # required transitively by flowmc>=0.6.1; jester caps <0.2.7
]

[tool.ruff]
extend-exclude = ["examples/"]

[tool.ruff.lint]
ignore = [
  "F722", # Forward annotation false positive
  "F821", # Undefined name
  "E731", # Lambda expressions
  "E741", # Ambiguous variable name
  "F841", # Unused local variable
  "E722", # Bare except
  "E402", # Module level import not at top of file
]

[tool.ruff.lint.isort]
combine-as-imports = true
lines-after-imports = 2
order-by-type = false

[tool.pyright]
reportIncompatibleMethodOverride = true
include = ["src/ninjax"]

# pyproject.toml
[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --strict-config --timeout=300"
testpaths = ["tests"]
markers = [
  "slow: marks tests as slow (deselect with '-m \"not slow\"')",
  "integration: marks tests as integration tests",
  "unit: marks tests as unit tests",
]

[tool.coverage.run]
source = ["ninjax"]
omit = ["*/tests/*", "*/examples/*"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "if self.debug:",
  "if settings.DEBUG",
  "raise AssertionError",
  "raise NotImplementedError",
  "if 0:",
  "if __name__ == .__main__.:",
]

[tool.setuptools.packages.find]
exclude = ["*.venv", ".venv", ".venv.*"]
